
<article
  class="home-task"
  [class.clickable]="isClickable"
  [attr.role]="isClickable ? 'button' : null"
  [attr.tabindex]="isClickable ? 0 : null"
  [attr.aria-label]="task.taskId + ': ' + task.title + ', ' + statusLabel"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <div class="task-content">
    <div class="task-title-row">
      <mat-icon
        class="status-icon"
        [class.done]="statusLabel === 'Done'"
        [class.in-progress]="statusLabel === 'In progress'"
        [class.blocked]="statusLabel === 'Blocked'"
      >
        {{ statusIcon }}
      </mat-icon>
      <span class="task-id">{{ task.taskId }}:</span>
      <strong class="task-title">{{ task.title }}</strong>
    </div>

    <div class="task-meta">
      <span>Task</span>
      <span>{{ task.projectKey }}-{{ task.issueNumber }}</span>
      <span class="project-name">{{ task.projectName }}</span>
    </div>
  </div>

  <time class="updated-time" [attr.datetime]="task.updatedAt">{{ getRelativeTime() }}</time>
</article>
