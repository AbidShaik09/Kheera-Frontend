<main class="dashboard-page" aria-labelledby="dashboard-title">
  <header class="dashboard-header">
    <div>
      <p class="eyebrow">Dashboard</p>
      <h1 id="dashboard-title">Today at Kheera</h1>
    </div>
    <p>Choose a space to keep your workspace in view.</p>
  </header>
  <div class="dashboard-grid">
    <section class="task-board" aria-label="Task sections">
      @for (section of sections; track section) {
        <section class="task-section" [attr.aria-label]="section">
          <header>
            <h2>{{ section }}</h2>
          </header>
          <p class="pending-message">
            Task history is coming soon. Your work will appear here when it is available.
          </p>
        </section>
      }
    </section>
    <aside class="right-rail panel" aria-labelledby="focus-title">
      <h2 id="focus-title">Today's Focus</h2>
      <p class="pending-message">Your focus list is coming soon.</p>
    </aside>
  </div>
</main>
