<div>
  @if (!isLoggedIn()) {
    <div class="flex bg-background h-3"></div>
  } @else {
    <div class="flex gap-3 border border-border align-center justify-between items-center">
      <app-navbar-logo />
      <div class="flex gap-2 items-center">
        <app-global-search />
        <app-knight-btn text="Create" icon="add" type="secondary" (onClick)="createBtnClicked()" />
      </div>
      <div class="flex gap-2 items-center">
        <app-knight-btn icon="notifications" type="icon" (onClick)="createBtnClicked()" />
        <app-knight-btn [icon]="themeIcon()" type="icon" (onClick)="toggleTheme()" />
        <app-knight-btn icon="settings" type="icon" (onClick)="navButtonClicked('settings')" />
        <app-knight-btn icon="account_circle" type="icon" (onClick)="navButtonClicked('profile')" />
      </div>
    </div>
  }
</div>
